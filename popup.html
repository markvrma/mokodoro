<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mokodoro</title>
  <style>
    body { width: 220px; margin: 0; padding: 12px; background: #000; color: #eaeaea;
           font: 12px Menlo, "SF Mono", Consolas, monospace; }
    input { width: 100%; box-sizing: border-box; background: #111; color: #eaeaea;
            border: 1px solid #333; padding: 6px; font: inherit; }
    .row { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
    button { background: #1a1a1a; color: #eaeaea; border: 1px solid #333; padding: 4px 8px;
             font: inherit; cursor: pointer; }
    button:hover { border-color: #666; }
    #go { width: 100%; margin-top: 8px; }
    #err { color: #ff3b30; min-height: 14px; margin: 6px 0 0; }
  </style>
</head>
<body>
  <input id="dur" value="25min" spellcheck="false" aria-label="duration">
  <div class="row">
    <button data-d="5min">5m</button>
    <button data-d="15min">15m</button>
    <button data-d="25min">25m</button>
    <button data-d="50min">50m</button>
    <button data-d="1hr">1h</button>
  </div>
  <button id="go">start timer</button>
  <p id="err"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
